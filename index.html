<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo to PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo to PDF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6e8e8">
<style>
:root{
  --bg:#e6e8e8; --panel:#f4f5f5; --ink:#16181a; --mute:#5b6266; --line:#c4c9cb;
  --accent:#1f4fff; --accent-ink:#fff; --danger:#b3261e;
  font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141617; --panel:#1d2022; --ink:#eceeef; --mute:#9aa1a5; --line:#33383b; --accent:#6f8cff; --accent-ink:#0b1030; --danger:#ff8a80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none}
header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 28px 12px}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
#count{font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:flex;gap:20px;padding:0 28px 12px}
#stage{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#empty{text-align:center;padding:32px;max-width:420px}
#empty h2{font-size:28px;margin:0 0 10px;letter-spacing:-.015em}
#empty p{margin:0;color:var(--mute);font-size:18px;line-height:1.45}
#side{width:300px;flex:none;display:flex;flex-direction:column;gap:12px}
button{font:inherit;border:0;border-radius:12px;min-height:56px;padding:0 20px;font-size:18px;font-weight:600;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.big{min-height:72px;font-size:21px}
button:disabled{opacity:.4;cursor:default}
button.danger{color:var(--danger)}
.row{display:flex;gap:12px}.row button{flex:1}
#hint{font-size:15px;color:var(--mute);line-height:1.4;margin:4px 2px 0}
#status{font-size:15px;color:var(--mute);min-height:20px;margin:0 2px}
#strip{display:flex;gap:10px;overflow-x:auto;padding:4px 28px 16px;min-height:104px;-webkit-overflow-scrolling:touch}
#strip:empty{display:none}
.th{flex:none;width:84px;height:84px;border-radius:10px;border:2px solid transparent;background:var(--panel) center/cover no-repeat;position:relative;padding:0;min-height:0}
.th.on{border-color:var(--accent)}
.th span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px}
@media (max-width:760px){main{flex-direction:column}#side{width:auto}#stage{min-height:40vh}}
</style>
</head>
<body>
<header><h1>Photo to PDF</h1><div id="count">0 photos</div></header>
<main>
  <section id="stage" aria-live="polite">
    <div id="empty">
      <h2>Take your first photo</h2>
      <p>Each photo becomes one page. When you are done, export everything as a single PDF.</p>
    </div>
  </section>
  <aside id="side">
    <button class="primary big" id="take">Take photo</button>
    <button id="export" disabled>Export PDF</button>
    <div class="row">
      <button id="retake" disabled>Retake</button>
      <button id="del" class="danger" disabled>Delete</button>
    </div>
    <button id="clear" class="danger" disabled>Start over</button>
    <p id="status"></p>
    <p id="hint">Export opens the iPad share sheet. Choose Drive or Save to Files.</p>
  </aside>
</main>
<div id="strip" aria-label="Photos taken"></div>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<script>
(()=>{
const $=id=>document.getElementById(id);
const MAX=2000, QUALITY=.85;
let photos=[];      // {id, blob, w, h}
let sel=-1;         // selected index
let replaceId=null; // set when retaking
let url=null;

/* ---------- storage (IndexedDB, so a Safari reload does not lose photos) ---------- */
const db=new Promise(res=>{
  try{
    const r=indexedDB.open('photo-to-pdf',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);
  }catch(e){res(null)}
});
async function tx(mode,fn){
  const d=await db; if(!d) return null;
  return new Promise(res=>{
    try{
      const t=d.transaction('p',mode), s=t.objectStore('p'), q=fn(s);
      t.oncomplete=()=>res(q&&q.result); t.onerror=()=>res(null);
    }catch(e){res(null)}
  });
}
const save=p=>tx('readwrite',s=>s.put(p));
const drop=id=>tx('readwrite',s=>s.delete(id));
const wipe=()=>tx('readwrite',s=>s.clear());
const loadAll=()=>tx('readonly',s=>s.getAll());

/* ---------- image handling ---------- */
function toJpeg(file){
  return new Promise((ok,fail)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,MAX/Math.max(w,h));
      w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      c.toBlob(b=>{URL.revokeObjectURL(u);b?ok({blob:b,w,h}):fail()},'image/jpeg',QUALITY);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);fail()};
    im.src=u;
  });
}

/* ---------- minimal PDF writer (JPEG pages, no libraries) ---------- */
function buildPdf(items){
  const enc=new TextEncoder(), parts=[], off=[]; let len=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,dict,stream)=>{
    off[n]=len; push(n+' 0 obj\n'+dict+'\n');
    if(stream){push('stream\n');push(stream);push('\nendstream\n')}
    push('endobj\n');
  };
  push('%PDF-1.4\n');
  const N=items.length, kids=items.map((_,i)=>(3+i*3)+' 0 R').join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${N} >>`);
  items.forEach((it,i)=>{
    const pg=3+i*3, ct=pg+1, im=pg+2;
    const land=it.w>it.h, PW=land?792:612, PH=land?612:792, M=18;
    const s=Math.min((PW-2*M)/it.w,(PH-2*M)/it.h), dw=it.w*s, dh=it.h*s;
    const x=(PW-dw)/2, y=(PH-dh)/2;
    const content=enc.encode(`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`);
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(ct,`<< /Length ${content.length} >>`,content);
    obj(im,`<< /Type /XObject /Subtype /Image /Width ${it.w} /Height ${it.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${it.bytes.length} >>`,it.bytes);
  });
  const total=3+N*3, xr=len;
  let t=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let n=1;n<total;n++) t+=String(off[n]).padStart(10,'0')+' 00000 n \n';
  push(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- UI ---------- */
const status=m=>$('status').textContent=m||'';
function render(){
  const n=photos.length;
  $('count').textContent=n+(n===1?' photo':' photos');
  ['export','retake','del','clear'].forEach(id=>$(id).disabled=!n);
  $('take').textContent=n?'Take another photo':'Take photo';
  $('export').className=n?'primary big':'';
  $('take').className=n?'big':'primary big';
  const stage=$('stage'); if(url){URL.revokeObjectURL(url);url=null}
  stage.querySelectorAll('img').forEach(i=>i.remove());
  $('empty').style.display=n?'none':'';
  if(n){
    url=URL.createObjectURL(photos[sel].blob);
    const im=new Image();im.src=url;im.alt='Photo '+(sel+1)+' of '+n;stage.appendChild(im);
  }
  const strip=$('strip'); strip.innerHTML='';
  photos.forEach((p,i)=>{
    const b=document.createElement('button');b.className='th'+(i===sel?' on':'');
    b.setAttribute('aria-label','Photo '+(i+1));
    b.style.backgroundImage=`url(${p.thumb})`;
    b.innerHTML='<span>'+(i+1)+'</span>';
    b.onclick=()=>{sel=i;render()};
    strip.appendChild(b);
  });
  const cur=strip.querySelector('.on'); if(cur) cur.scrollIntoView({inline:'nearest',block:'nearest'});
}
function thumb(blob){return new Promise(ok=>{
  const u=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas'),k=168/Math.max(im.width,im.height);
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};
  im.src=u;
})}

$('take').onclick=()=>{replaceId=null;$('file').value='';$('file').click()};
$('retake').onclick=()=>{replaceId=photos[sel].id;$('file').value='';$('file').click()};
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  status('Processing photo...');
  try{
    const {blob,w,h}=await toJpeg(f);
    const th=await thumb(blob);
    if(replaceId){
      const i=photos.findIndex(p=>p.id===replaceId);
      const p={id:replaceId,blob,w,h,thumb:th};
      photos[i]=p;sel=i;await save({id:p.id,blob,w,h,thumb:th});
    }else{
      const p={id:Date.now()+Math.random(),blob,w,h,thumb:th};
      photos.push(p);sel=photos.length-1;await save(p);
    }
    status('');render();
  }catch(err){status('That photo could not be read. Try again.')}
};
$('del').onclick=async()=>{
  const [p]=photos.splice(sel,1);await drop(p.id);
  sel=Math.min(sel,photos.length-1);render();
};
$('clear').onclick=async()=>{
  if(!confirm('Delete all '+photos.length+' photos?')) return;
  photos=[];sel=-1;await wipe();render();
};
$('export').onclick=async()=>{
  status('Building PDF...');
  try{
    const items=[];
    for(const p of photos) items.push({w:p.w,h:p.h,bytes:new Uint8Array(await p.blob.arrayBuffer())});
    const pdf=buildPdf(items);
    const d=new Date(), name='photos-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.pdf';
    const file=new File([pdf],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});status('Shared.');return}
      catch(e){if(e.name==='AbortError'){status('');return}}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(pdf);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    status('PDF downloaded. Find it in Files, then upload to Drive.');
  }catch(err){status('Export failed. Try fewer photos.')}
};

(async()=>{
  const saved=await loadAll();
  if(saved&&saved.length){photos=saved.sort((a,b)=>a.id-b.id);sel=photos.length-1;}
  render();
})();
})();
</script>
</body>
</html>
